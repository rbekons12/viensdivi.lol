<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopienas "12" 2 gadu jubileja</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      padding: 20px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 56px);
      margin-bottom: 40px;
      font-weight: 600;
    }

    #timer {
      font-size: clamp(45px, 12vw, 110px);
      font-weight: bold;
      letter-spacing: 2px;
    }

    #message {
      margin-top: 30px;
      font-size: 24px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Kopienas "12" 2 gadu jubileja</h1>

    <div id="timer">00:00:00:00</div>

    <div id="message"></div>
  </div>

  <script>
    // Mērķis: 2026. gada 2. septembris, 20:12
    const targetDate = new Date("2026-09-02T20:12:00");

    function updateTimer() {
      const now = new Date();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("timer").textContent = "00:00:00:00";
        document.getElementById("message").textContent =
          "Kopienas \"12\" 2 gadu jubileja ir klāt!";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );
      const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );
      const seconds = Math.floor(
        (difference / 1000) % 60
      );

      document.getElementById("timer").textContent =
        `${String(days).padStart(2, "0")}:` +
        `${String(hours).padStart(2, "0")}:` +
        `${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
