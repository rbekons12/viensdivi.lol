    <!--
        Struktūra nākotnes jaunumiem. Katru jaunu ierakstu var pievienot
        kā jaunu .news-item bloku ar nosaukumu, datumu un aprakstu:

        <div class="news-item">
            <h3>Jaunuma nosaukums</h3>
            <p class="news-date">DD.MM.GGGG.</p>
            <p>Īss apraksts.</p>
        </div>
    -->
    <div class="news-item">
        <p>Jaunumi tiks pievienoti vēlāk.</p>
    </div>

    <footer>
        viensdivi.lol
    </footer>

<button id="contact-fab" class="contact-fab" aria-label="Nosūtīt ziņu" title="Nosūtīt ziņu">✉</button>

<div id="contact-modal" class="modal-overlay">
    <div class="modal-box">
        <button class="modal-close" aria-label="Aizvērt">×</button>
        <h2>Nosūtīt ziņu</h2>
        <form id="contact-form">
            <label for="contact-name">Vārds</label>
            <input type="text" id="contact-name" name="name">

            <label for="contact-email">E-pasts</label>
            <input type="email" id="contact-email" name="email">

            <label for="contact-message">Ziņa</label>
            <textarea id="contact-message" name="message"></textarea>

            <button type="submit" class="modal-submit">Nosūtīt</button>
            <p class="modal-status"></p>
        </form>
    </div>
</div>

<script src="site.js"></script>
</body>
