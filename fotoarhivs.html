<!--
    ============================================================
    FOTOARHĪVA DATI  —  ŠEIT PIEVIENO PASĀKUMUS UN FOTO
    ============================================================
    Lapas izkārtojums un HTML nav jālabo. Viss, kas redzams lapā,
    tiek uzģenerēts no šī saraksta.

    KĀ PIEVIENOT JAUNU PASĀKUMU
      1. Nokopē visu bloku no { title: ... līdz atbilstošajai },
      2. ielīmē to saraksta beigās (aiz iepriekšējā bloka un komata),
      3. nomaini title, date un foto.

    KĀ PIEVIENOT JAUNU FOTO
      1. Ieliec attēla failu mapē  images/fotoarhivs/
         (piem. images/fotoarhivs/piga-04.jpg),
      2. nokopē vienu bloku { src: ..., photographer: ... },
         ielīmē aiz iepriekšējā (nepamet komatu starp blokiem),
      3. nomaini src un pārējos laukus.

    LAUKI KATRAM FOTO
      src          — ceļš uz attēlu, vienmēr sākas ar  images/fotoarhivs/
      photographer — foto autors (nav obligāts)
      people       — kas redzams fotogrāfijā (nav obligāts)
      caption      — īss paraksts (nav obligāts)
      alt          — attēla apraksts redzes invalīdiem (nav obligāts;
                     ja tukšs, tiks izmantots pasākuma nosaukums + numurs)

    Tukšu lauku ('') lapā nerāda — nekādu tukšu iekavu vai "undefined".
    Ja attēla fails vēl nav pievienots, lapā redzams vietturis
    "Pievieno foto". Vietturu vērtības [vārds] / [vārdi] aizstāj ar
    īstajām, kad tās zināmas — vai izdzēs lauku (ieliec '').

    Atbalstītie formāti: .jpg  .jpeg  .png  .webp  .gif  .avif
    Faila nosaukums: tikai mazie burti, cipari un domuzīmes,
    bez garumzīmēm un atstarpēm (piem. piga-01.jpg).
    ============================================================
-->
<script>
var photoArchive = [
    {

            }

    }
    // Nākamo pasākumu pievieno šeit: ieliec komatu aiz augšējās } un ielīmē jaunu bloku
];
</script>
